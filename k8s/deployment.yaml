apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-devsecops-app
  namespace: ai-devsecops
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: ai-devsecops-app

  template:
    metadata:
      labels:
        app: ai-devsecops-app

    spec:
      containers:
        - name: ai-devsecops-app
          image: 874777259388.dkr.ecr.us-east-1.amazonaws.com/ai-devsecops-platform:21

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20